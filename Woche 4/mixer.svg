<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<defs>
 <marker id="dep" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#334155" stroke-width="1.5"/></marker>
 <marker id="real" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11 Z" fill="white" stroke="#334155" stroke-width="1.3"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
 .comp{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:9}
 .ext{fill:#fff7ed;stroke:#c2410c;stroke-width:2;stroke-dasharray:7 5;rx:10}
 .child{fill:#eff6ff;stroke:#2563eb;stroke-width:1.8;rx:7}
 .iface{fill:#fefce8;stroke:#a16207;stroke-width:2;rx:8}
 .dep{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#dep)}
 .real{fill:none;stroke:#334155;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#real)}
 .head{font-size:22px;font-weight:bold}.name{font-size:17px;font-weight:bold}.small{font-size:13px}.tiny{font-size:11px}
 </style>
</defs>
<rect width="1200" height="850" fill="white"/>
<text x="600" y="38" text-anchor="middle" class="head">Komponentdiagramm – Mischpult</text>

<!-- External computer / music app -->
<rect x="45" y="80" width="250" height="180" class="ext"/>
<text x="170" y="108" text-anchor="middle" class="name">«externes System»</text>
<text x="170" y="129" text-anchor="middle" class="small">Computer</text>
<rect x="90" y="155" width="160" height="75" class="comp"/>
<text x="170" y="187" text-anchor="middle" class="name">Musik-App</text>
<text x="170" y="209" text-anchor="middle" class="tiny">«Komponente»</text>

<!-- Microphone -->
<rect x="420" y="80" width="210" height="145" class="comp"/>
<text x="525" y="112" text-anchor="middle" class="name">Mikrofon</text>
<text x="525" y="134" text-anchor="middle" class="tiny">«Komponente»</text>
<rect x="510" y="151" width="30" height="48" rx="15" fill="none" stroke="#334155" stroke-width="2"/>
<path d="M525 199 V208 M510 208 H540" fill="none" stroke="#334155" stroke-width="2"/>

<!-- Input interface -->
<rect x="730" y="125" width="170" height="72" class="iface"/>
<text x="815" y="151" text-anchor="middle" class="small">«interface»</text>
<text x="815" y="177" text-anchor="middle" class="name">Input</text>

<!-- Mixer -->
<rect x="390" y="390" width="275" height="190" class="comp"/>
<text x="527" y="425" text-anchor="middle" class="name">Mixer</text>
<text x="527" y="448" text-anchor="middle" class="tiny">«Komponente»</text>
<rect x="425" y="470" width="205" height="78" fill="white" stroke="#94a3b8" rx="6"/>
<text x="527" y="500" text-anchor="middle" class="small">Verwaltet und bearbeitet</text>
<text x="527" y="522" text-anchor="middle" class="small">alle Sound-Eingaben</text>

<!-- SoundChange interface -->
<rect x="745" y="450" width="175" height="75" class="iface"/>
<text x="832" y="478" text-anchor="middle" class="small">«interface»</text>
<text x="832" y="505" text-anchor="middle" class="name">SoundChange</text>

<!-- Sound system -->
<rect x="965" y="300" width="205" height="310" class="comp"/>
<text x="1067" y="333" text-anchor="middle" class="name">Soundsystem</text>
<text x="1067" y="354" text-anchor="middle" class="tiny">«Komponente»</text>
<rect x="990" y="380" width="155" height="90" class="child"/>
<text x="1067" y="405" text-anchor="middle" class="name">Lautsprecher</text>
<path d="M1030 425 h17 l23 -15 v45 l-23 -15 h-17 z M1075 422 q18 15 0 30" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="990" y="490" width="155" height="90" class="child"/>
<text x="1067" y="515" text-anchor="middle" class="name">Subwoofer</text>
<circle cx="1067" cy="548" r="23" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="1067" cy="548" r="10" fill="none" stroke="#2563eb" stroke-width="2"/>

<!-- dB sensor -->
<rect x="45" y="610" width="250" height="175" class="ext"/>
<text x="170" y="640" text-anchor="middle" class="name">«externes System»</text>
<rect x="90" y="665" width="160" height="85" class="comp"/>
<text x="170" y="698" text-anchor="middle" class="name">dB-Sensor</text>
<text x="170" y="720" text-anchor="middle" class="tiny">überwacht Lautstärke</text>

<!-- Connections -->
<!-- Music app uses Input -->
<path d="M250 192 H330 V160 H730" class="dep"/>
<text x="465" y="148" text-anchor="middle" class="tiny">nutzt Input</text>
<!-- Microphone implements Input -->
<path d="M630 160 H730" class="real"/>
<text x="680" y="145" text-anchor="middle" class="tiny">implementiert</text>
<!-- Mixer uses Input -->
<path d="M815 197 V320 H700 V485 H665" class="dep"/>
<text x="715" y="310" text-anchor="middle" class="tiny">nutzt Input</text>
<!-- Mixer uses SoundChange -->
<path d="M665 485 H745" class="dep"/>
<text x="705" y="472" text-anchor="middle" class="tiny">nutzt</text>
<!-- Sound system provides SoundChange -->
<path d="M920 487 H965" class="real"/>
<text x="942" y="470" text-anchor="middle" class="tiny">stellt bereit</text>
<!-- dB sensor uses SoundChange: routed below components -->
<path d="M250 707 H325 V760 H832 V525" class="dep"/>
<text x="560" y="748" text-anchor="middle" class="tiny">nutzt SoundChange zur Kontrolle der maximalen Lautstärke</text>

<!-- Legend -->
<rect x="745" y="655" width="425" height="115" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
<text x="765" y="683" class="name">Legende</text>
<path d="M765 710 H830" class="real"/>
<text x="850" y="715" class="small">Implementierung / bereitgestelltes Interface</text>
<path d="M765 742 H830" class="dep"/>
<text x="850" y="747" class="small">Nutzung / benötigtes Interface</text>
<text x="45" y="825" class="tiny">Komponenten innerhalb eines Rahmens gehören zum jeweiligen übergeordneten System.</text>
</svg>